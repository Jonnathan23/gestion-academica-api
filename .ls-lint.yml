ls:
    src/**:
        .dir: kebab-case
        .ts: camelCase | PascalCase
    src/**/domain:
        .dto.ts: PascalCase
        .model.ts: PascalCase
        .projection.ts: PascalCase
        .interface.ts: PascalCase
        .datasource.ts: camelCase
        .repository.ts: camelCase
    src/**/infrastructure:
        .interface.ts: PascalCase
        .datasource.impl.ts: camelCase
        .mapper.ts: camelCase
    src/**/application:
        .use-case.ts: camelCase
    src/**/presentation:
        .controller.ts: PascalCase
        .worker.ts: PascalCase
        .routes.ts: camelCase
    src/data/config:
        .ts: camelCase | PascalCase
    src/data/models:
        .model.ts: PascalCase

ignore:
    - node_modules
    - .git
    - dist
    - docs
    - .vscode
    - scripts
    - .agents
    - src/**/__tests__
    - src/**/__test__
